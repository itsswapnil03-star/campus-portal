{% extends 'base.html' %}
{% block body %}
<h2>Login</h2>
<form method='post'>
<input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>
<input name='email' type='email' placeholder='Email' required>
<input name='password' type='password' placeholder='Password' required>
<button>Login</button>
</form>
{% endblock %}
